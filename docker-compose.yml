services:
  # ────────────────────────────────────────────
  # PostgreSQL + PostGIS
  # ────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: thermasense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: thermasense
      POSTGRES_PASSWORD: thermasense
      POSTGRES_DB: thermasense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermasense"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────
  # FastAPI Backend
  # ────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thermasense_api
    restart: unless-stopped
    environment:
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      DATABASE_URL: postgresql+asyncpg://thermasense:thermasense@db:5432/thermasense
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  # ────────────────────────────────────────────
  # Next.js Frontend
  # ────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thermasense_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  pgdata:

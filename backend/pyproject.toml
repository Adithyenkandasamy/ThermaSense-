[project]
name = "thermasense"
version = "0.1.0"
description = "AI-enabled geospatial thermal-event intelligence platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # Database / ORM
    "sqlalchemy[asyncio]>=2.0.36",
    "geoalchemy2>=0.15.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",   # needed by Alembic sync operations
    # Migrations
    "alembic>=1.13.0",
    # Config
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    # HTTP client (for FIRMS, OSM ingestion later)
    "httpx>=0.27.0",
    # Data processing (Phase 3+)
    "pandas>=2.2.0",
    # Geospatial processing (Phase 4+)
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    # Raster processing for WorldCover (Phase 5+)
    "rasterio>=1.3.0",
    "rasterstats>=0.19.0",
    "groq>=1.7.0",
    "apscheduler>=3.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",   # for TestClient
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
